<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Служения</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       var(--tg-theme-bg-color,            #ffffff);
      --bg2:      var(--tg-theme-secondary-bg-color,  #f2f2f7);
      --text:     var(--tg-theme-text-color,           #000000);
      --hint:     var(--tg-theme-hint-color,           #8e8e93);
      --link:     var(--tg-theme-link-color,           #2481cc);
      --btn:      var(--tg-theme-button-color,         #2481cc);
      --btn-text: var(--tg-theme-button-text-color,    #ffffff);
      --danger:   #ff3b30;
      --success:  #34c759;
      --radius:   14px;
      --nav-h:    64px;
      --safe-b:   env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Rubik', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .header {
      padding: 18px 16px 10px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
    }

    /* ── Bottom Navigation ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: var(--bg);
      border-top: 1px solid rgba(128,128,128,0.18);
      display: flex;
      z-index: 100;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--hint);
      transition: color 0.2s;
      font-family: 'Rubik', sans-serif;
    }

    .nav-btn.active { color: var(--btn); }
    .nav-btn svg { width: 24px; height: 24px; }
    .nav-btn span { font-size: 11px; font-weight: 500; }

    /* ── Screens ── */
    .screen { display: none; }
    .screen.active {
      display: block;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Booking cards ── */
    .card-list {
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .booking-card {
      background: var(--bg2);
      border-radius: var(--radius);
      padding: 14px 16px 12px;
      position: relative;
    }

    .booking-card .svc-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 7px;
      padding-right: 72px;
    }

    .booking-meta {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: var(--hint);
      flex-wrap: wrap;
    }

    .booking-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .partner-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: color-mix(in srgb, var(--btn) 12%, transparent);
      color: var(--btn);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 9px;
    }

    .cancel-btn {
      position: absolute;
      top: 13px; right: 13px;
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      color: var(--danger);
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: 'Rubik', sans-serif;
      font-weight: 500;
      cursor: pointer;
    }

    /* ── Empty / Loading ── */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--hint);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-state svg { width: 56px; height: 56px; opacity: 0.3; }
    .empty-state .empty-title { font-size: 16px; font-weight: 500; }
    .empty-state .empty-sub   { font-size: 13px; opacity: 0.8; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
    }

    .spinner {
      width: 30px; height: 30px;
      border: 3px solid var(--bg2);
      border-top-color: var(--btn);
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── User list (partner picker) ── */
    .option-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      background: var(--bg2);
      border-radius: var(--radius);
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .user-item.selected { border-color: var(--btn); }

    .user-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--btn);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: var(--btn-text);
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .user-name { font-weight: 500; font-size: 15px; }

    /* ── Confirm card ── */
    .confirm-card {
      margin: 0 16px;
      background: var(--bg2);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .confirm-row {
      display: flex;
      align-items: flex-start;
      padding: 13px 16px;
      border-bottom: 1px solid rgba(128,128,128,0.12);
    }

    .confirm-row:last-child { border-bottom: none; }
    .confirm-lbl { font-size: 13px; color: var(--hint); width: 90px; flex-shrink: 0; padding-top: 1px; }
    .confirm-val { font-size: 15px; font-weight: 500; }

    /* ── Action bar & Button ── */
    .action-bar {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-btn {
      width: 100%;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Rubik', sans-serif;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .action-btn:active   { opacity: 0.8; transform: scale(0.98); }
    .action-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .action-btn.secondary {
      background: var(--bg2);
      color: var(--text);
    }

    /* ── Success screen ── */
    .success-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 24px;
      text-align: center;
    }

    .success-icon {
      width: 72px; height: 72px;
      background: linear-gradient(145deg, #34c759, #28a348);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(52,199,89,0.35);
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }

    .success-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }

    .success-detail-card {
      margin: 20px 0;
      background: var(--bg2);
      border-radius: var(--radius);
      padding: 14px 20px;
      width: 100%;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .success-detail-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--hint);
    }

    .success-detail-row strong { color: var(--text); font-weight: 500; }

    /* ── Bottom Sheet Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .sheet {
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px calc(24px + var(--safe-b));
      width: 100%;
      animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--hint);
      border-radius: 2px;
      margin: 0 auto 20px;
      opacity: 0.35;
    }

    .sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .sheet p  { font-size: 14px; color: var(--hint); margin-bottom: 20px; line-height: 1.5; }
    .sheet-actions { display: flex; flex-direction: column; gap: 10px; }

    .sheet-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Rubik', sans-serif;
      cursor: pointer;
    }

    .sheet-btn.danger  { background: var(--danger); color: #fff; }
    .sheet-btn.neutral { background: var(--bg2);    color: var(--text); }

    /* ── Schedule cards ── */
    .sched-list {
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
    }

    .sched-card {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e5e5ea;
      padding: 12px;
      margin-bottom: 10px;
    }

    .sched-header {
      font-size: 14px;
      font-weight: 600;
      color: #2481cc;
      margin-bottom: 4px;
      letter-spacing: 0.2px;
    }

    .sched-pair {
      background: #f7f7f7;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      padding: 6px 10px;
      margin-top: 4px;
    }

    .sched-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      padding: 3px 0;
    }

    .sched-time {
      color: #8e8e93;
      font-size: 14px;
      flex-shrink: 0;
      width: 44px;
    }

    .sched-name {
      flex: 1;
      text-align: right;
      font-size: 14px;
      font-weight: 500;
      color: #1c1c1e;
    }

    .sched-free {
      flex: 1;
      text-align: right;
      font-size: 14px;
      font-weight: 500;
      color: #34c759;
    }

    /* ── Book Overlay ── */
    #book-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #book-overlay.active {
      display: flex;
      flex-direction: column;
      animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
    }

    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 4px;
      flex-shrink: 0;
    }

    .overlay-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--bg2);
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--hint);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .overlay-back {
      background: none;
      border: none;
      color: var(--btn);
      font-size: 15px;
      font-family: 'Rubik', sans-serif;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
    }

    .overlay-body {
      flex: 1;
      padding-bottom: calc(80px + var(--safe-b));
    }

    .overlay-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 16px calc(12px + var(--safe-b));
      background: var(--bg);
      border-top: 1px solid rgba(128,128,128,0.12);
      z-index: 201;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid rgba(128,128,128,0.2);
      background: var(--bg2);
      font-size: 15px;
      font-family: 'Rubik', sans-serif;
      color: var(--text);
      outline: none;
      margin-bottom: 12px;
    }

    .search-input::placeholder { color: var(--hint); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
      left: 16px; right: 16px;
      background: #1c1c1e;
      color: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      z-index: 400;
      text-align: center;
      animation: slideUp 0.25s ease;
    }

    .toast.err { background: var(--danger); }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="header" id="main-header">
    <h1 id="header-greeting">Загрузка…</h1>
  </div>

  <!-- Scrollable content -->
  <div class="content">
    <div class="screen active" id="screen-bookings"></div>
    <div class="screen" id="screen-schedule"></div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-bookings" onclick="switchTab('bookings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="14" x2="8" y2="14"/>
        <line x1="12" y1="14" x2="12" y2="14"/>
        <line x1="16" y1="14" x2="16" y2="14"/>
        <line x1="8" y1="18" x2="8" y2="18"/>
        <line x1="12" y1="18" x2="12" y2="18"/>
      </svg>
      <span>Мои записи</span>
    </button>
    <button class="nav-btn" id="nav-schedule" onclick="switchTab('schedule')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span>Все записи</span>
    </button>
  </nav>
</div>

<!-- Book Overlay -->
<div id="book-overlay"></div>

<!-- Modal / Toast containers -->
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ══════════════════════════════════════════════════════
   TELEGRAM INIT
══════════════════════════════════════════════════════ */
const tg = window.Telegram?.WebApp || {
  initData: '',
  initDataUnsafe: { user: { id: 99999, first_name: 'Тест', last_name: 'Пользователь' } },
  expand() {}, ready() {}, close() {},
  HapticFeedback: { impactOccurred() {}, notificationOccurred() {} },
  colorScheme: 'light',
};

tg.ready();
tg.expand();

/* ══════════════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════════════ */
const API = '/api';

/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
const S = {
  userId: null,
  firstName: '',
  congregationId: null,
  bookings: [],
  schedule: [],
  bk: {
    slotId: null, serviceId: null, serviceName: null,
    date: null, dateLabel: null, time: null,
    status: null, partner: null, existingUser: null,
  },
  bookStep: null,   // 'choice' | 'partner' | 'confirm' | 'success'
  users: [],        // кэш для выбора напарника
};

/* ══════════════════════════════════════════════════════
   API HELPER
══════════════════════════════════════════════════════ */
function api(path, opts = {}) {
  const url = API + path;
  console.log('[API] →', opts.method || 'GET', url);
  return fetch(url, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'X-Telegram-Init-Data': tg.initData || '',
      ...(opts.headers || {}),
    },
  }).then(r => { console.log('[API] ←', r.status, url); return r; });
}

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
async function init() {
  const u = tg.initDataUnsafe?.user;
  if (!u) {
    document.getElementById('screen-bookings').innerHTML =
      html_empty('Нет данных пользователя', 'Откройте приложение через Telegram');
    document.getElementById('header-greeting').textContent = 'Служения';
    return;
  }
  S.userId = u.id;
  S.firstName = u.first_name || 'пользователь';

  try {
    const r = await api(`/me?user_id=${S.userId}`);
    if (r.ok) {
      const d = await r.json();
      S.congregationId = d.congregation_id;
      document.getElementById('header-greeting').textContent = 'Привет, ' + d.first_name + '!';
    } else {
      document.getElementById('header-greeting').textContent = 'Привет, ' + S.firstName + '!';
    }
  } catch (_) {
    document.getElementById('header-greeting').textContent = 'Привет, ' + S.firstName + '!';
  }

  console.log('[init] userId =', S.userId);
  await loadBookings();
}

/* ══════════════════════════════════════════════════════
   MY BOOKINGS
══════════════════════════════════════════════════════ */
async function loadBookings() {
  const scr = document.getElementById('screen-bookings');
  scr.innerHTML = html_loading();
  try {
    const r = await api(`/my_bookings?user_id=${S.userId}`);
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      scr.innerHTML = html_empty('Ошибка ' + r.status, err.message || 'Не удалось загрузить записи');
      return;
    }
    S.bookings = await r.json();
    renderBookings();
  } catch (_) {
    scr.innerHTML = html_empty('Ошибка сети', 'Проверьте подключение и попробуйте снова');
  }
}

function renderBookings() {
  const scr = document.getElementById('screen-bookings');
  if (!S.bookings.length) {
    scr.innerHTML = html_empty('Записей нет', 'Откройте «Все записи» и запишитесь на свободный слот');
    return;
  }

  scr.innerHTML = `<div class="card-list">` +
    S.bookings.map(b => `
      <div class="booking-card">
        <div class="svc-name">${esc(b.service)}</div>
        <div class="booking-meta">
          <span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            ${esc(b.date)}
          </span>
          <span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            ${esc(b.time)}
          </span>
        </div>
        ${b.partner ? `
          <div class="partner-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            ${esc(b.partner)}
          </div>` : ''}
        <button class="cancel-btn"
          onclick="askCancel(${b.slot_id},'${esc(b.service)}','${esc(b.date)}','${esc(b.time)}')">
          Отменить
        </button>
      </div>
    `).join('') +
  `</div>`;
}

/* ══════════════════════════════════════════════════════
   CANCEL BOOKING
══════════════════════════════════════════════════════ */
function askCancel(slotId, svc, date, time) {
  haptic('light');
  modal(`
    <div class="sheet-handle"></div>
    <h3>Отменить запись?</h3>
    <p>${esc(svc)}<br>${esc(date)} в ${esc(time)}</p>
    <div class="sheet-actions">
      <button class="sheet-btn danger" onclick="doCancel(${slotId})">Да, отменить</button>
      <button class="sheet-btn neutral" onclick="closeModal()">Оставить</button>
    </div>
  `);
}

async function doCancel(slotId) {
  closeModal();
  document.getElementById('screen-bookings').innerHTML = html_loading();
  try {
    const r = await api('/cancel', {
      method: 'DELETE',
      body: JSON.stringify({ user_id: S.userId, slot_id: slotId }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      haptic('error');
      showToast(err.message || 'Ошибка ' + r.status, true);
      renderBookings();
      return;
    }
    const d = await r.json();
    if (d.success) {
      haptic('success');
      showToast('Запись отменена');
      S.bookings = S.bookings.filter(b => b.slot_id !== slotId);
      renderBookings();
    } else {
      haptic('error');
      showToast(d.message || 'Ошибка при отмене', true);
      renderBookings();
    }
  } catch (_) {
    showToast('Ошибка сети', true);
    renderBookings();
  }
}

/* ══════════════════════════════════════════════════════
   TAB SWITCH
══════════════════════════════════════════════════════ */
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.getElementById('nav-' + tab).classList.add('active');
  if (tab === 'bookings') loadBookings();
  if (tab === 'schedule') loadSchedule();
}

/* ══════════════════════════════════════════════════════
   ALL SCHEDULES
══════════════════════════════════════════════════════ */
async function loadSchedule() {
  const scr = document.getElementById('screen-schedule');
  scr.innerHTML = html_loading();
  if (!S.congregationId) {
    scr.innerHTML = html_empty('Собрание не определено', 'Попробуйте перезапустить приложение');
    return;
  }
  try {
    const r = await api(`/schedule?congregation_id=${S.congregationId}`);
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      scr.innerHTML = html_empty('Ошибка ' + r.status, err.error || 'Не удалось загрузить расписание');
      return;
    }
    S.schedule = await r.json();
    renderSchedule();
  } catch (_) {
    scr.innerHTML = html_empty('Ошибка сети', 'Проверьте подключение и попробуйте снова');
  }
}

function renderSchedule() {
  const scr = document.getElementById('screen-schedule');
  if (!S.schedule.length) {
    scr.innerHTML = html_empty('Нет расписания', 'На ближайшие 30 дней слотов нет');
    return;
  }

  const groups = new Map();
  for (const s of S.schedule) {
    const key = s.date + '|' + s.service_id;
    if (!groups.has(key)) {
      groups.set(key, {
        date: s.date, date_label: s.date_label,
        service_id: s.service_id, service_name: s.service_name,
        rows: [],
      });
    }
    groups.get(key).rows.push(s);
  }

  let html = '<div class="sched-list">';
  for (const g of groups.values()) {
    html += `<div class="sched-card">`;
    html += `<div class="sched-header">📅 ${esc(g.date_label)} · ${esc(g.service_name)}</div>`;
    for (const s of g.rows) {
      const existingUser = s.user1 || s.user2 || null;
      const clickable = s.status !== 0;
      const pairAttrs = clickable
        ? `style="cursor:pointer" onclick="openSlot(${s.slot_id},${s.service_id},'${esc(g.service_name)}','${s.date}','${esc(g.date_label)}','${esc(s.time)}',${s.status},${existingUser ? `'${esc(existingUser)}'` : 'null'})"`
        : `style="cursor:default"`;
      html += `<div class="sched-pair" ${pairAttrs}>`;
      html += `<div class="sched-row">
        <span class="sched-time">${esc(s.time)}</span>
        <span ${s.user1 ? 'class="sched-name"' : 'class="sched-free"'}>${s.user1 ? esc(s.user1) : 'свободно'}</span>
      </div>`;
      html += `<div class="sched-row">
        <span class="sched-time">${esc(s.time)}</span>
        <span ${s.user2 ? 'class="sched-name"' : 'class="sched-free"'}>${s.user2 ? esc(s.user2) : 'свободно'}</span>
      </div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += '</div>';
  scr.innerHTML = html;
}

/* ══════════════════════════════════════════════════════
   BOOK OVERLAY
══════════════════════════════════════════════════════ */
function openSlot(slotId, serviceId, serviceName, dateIso, dateLabel, time, status, existingUser) {
  haptic('light');
  S.bk = { slotId, serviceId, serviceName, date: dateIso, dateLabel, time, status, partner: null, existingUser: existingUser || null };
  S.bookStep = status === 2 ? 'choice' : 'confirm';
  renderBookOverlay();
}

function closeOverlay() {
  const el = document.getElementById('book-overlay');
  el.classList.remove('active');
  el.innerHTML = '';
  S.bookStep = null;
}

function renderBookOverlay() {
  const el = document.getElementById('book-overlay');

  let body = '';
  if (S.bookStep === 'choice')  body = renderChoice();
  if (S.bookStep === 'partner') body = renderPartner();
  if (S.bookStep === 'confirm') body = renderConfirm();
  if (S.bookStep === 'success') body = renderOverlaySuccess();

  const leftBtn = S.bookStep === 'partner'
    ? `<button class="overlay-back" onclick="goStep('choice')">← Назад</button>`
    : `<div></div>`;
  const rightBtn = S.bookStep !== 'success'
    ? `<button class="overlay-close" onclick="closeOverlay()">×</button>`
    : `<div></div>`;

  el.innerHTML = `
    <div class="overlay-header">${leftBtn}${rightBtn}</div>
    <div class="overlay-body">${body}</div>`;
  el.classList.add('active');
  if (S.bookStep === 'partner') {
    setTimeout(() => {
      const inp = document.getElementById('partner-search');
      if (inp) inp.addEventListener('input', function() { filterPartners(this.value); });
    }, 50);
  }
}

function goStep(step) {
  S.bookStep = step;
  renderBookOverlay();
}

/* Step: choice */
function renderChoice() {
  return `
    <div style="padding: 8px 0 4px;">
      <div class="confirm-card">
        <div class="confirm-row">
          <div class="confirm-lbl">Служение</div>
          <div class="confirm-val">${esc(S.bk.serviceName)}</div>
        </div>
        <div class="confirm-row">
          <div class="confirm-lbl">Дата</div>
          <div class="confirm-val">${esc(S.bk.dateLabel)}</div>
        </div>
        <div class="confirm-row">
          <div class="confirm-lbl">Время</div>
          <div class="confirm-val">${esc(S.bk.time)}</div>
        </div>
      </div>
    </div>
    <div class="action-bar">
      <button class="action-btn" onclick="goStep('confirm')">Записаться</button>
      <button class="action-btn secondary" onclick="loadPartners()">Выбрать напарника</button>
    </div>`;
}

async function loadPartners() {
  document.getElementById('book-overlay').querySelector('.overlay-body').innerHTML = html_loading();
  try {
    const r = await api(`/users?user_id=${S.userId}`);
    if (!r.ok) throw new Error();
    S.users = await r.json();
  } catch (_) {
    S.users = [];
  }
  S.bookStep = 'partner';
  renderBookOverlay();
}

/* Step: partner */
function renderPartner() {
  const items = S.users.map(u => renderUserItem(u)).join('');
  const listContent = S.users.length
    ? `<div class="option-list">${items}</div>`
    : `<div class="empty-state" style="padding:32px 24px;"><div class="empty-title">Нет пользователей</div></div>`;

  return `
    <div style="padding: 8px 16px 0;">
      <input id="partner-search" class="search-input" type="text" placeholder="Поиск по имени">
    </div>
    <div id="partner-list">${listContent}</div>
    <div class="overlay-footer">
      <button id="partner-submit-btn" class="action-btn" ${S.bk.partner ? '' : 'disabled'} onclick="goStep('confirm')">
        Записаться
      </button>
    </div>`;
}

function renderUserItem(u) {
  const sel = S.bk.partner?.user_id === u.user_id;
  const ini = ((u.first_name?.[0] || '') + (u.last_name?.[0] || '')).toUpperCase();
  return `
    <div class="user-item${sel ? ' selected' : ''}" onclick="selectPartner(${u.user_id})">
      <div class="user-avatar">${ini}</div>
      <div class="user-name">${esc(u.name)}</div>
      ${sel ? `<svg style="margin-left:auto;color:var(--btn)" width="20" height="20"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <polyline points="20 6 9 17 4 12"/></svg>` : ''}
    </div>`;
}

function selectPartner(userId) {
  const u = S.users.find(u => u.user_id === userId);
  S.bk.partner = S.bk.partner?.user_id === userId
    ? null
    : (u ? { user_id: u.user_id, name: u.name } : null);
  haptic('light');
  const currentQuery = document.getElementById('partner-search')?.value || '';
  filterPartners(currentQuery);
}

function filterPartners(query) {
  const filtered = S.users.filter(u =>
    u.name.toLowerCase().includes(query.toLowerCase())
  );
  const list = document.getElementById('partner-list');
  if (!list) return;
  const items = filtered.map(u => renderUserItem(u)).join('');
  list.innerHTML = filtered.length
    ? `<div class="option-list">${items}</div>`
    : `<div class="empty-state" style="padding:32px 24px;"><div class="empty-title">Никого не найдено</div></div>`;
  const btn = document.getElementById('partner-submit-btn');
  if (btn) btn.disabled = !S.bk.partner;
}

/* Step: confirm */
function renderConfirm() {
  return `
    <div style="padding: 8px 0 4px;">
      <div class="confirm-card">
        <div class="confirm-row">
          <div class="confirm-lbl">Служение</div>
          <div class="confirm-val">${esc(S.bk.serviceName)}</div>
        </div>
        <div class="confirm-row">
          <div class="confirm-lbl">Дата</div>
          <div class="confirm-val">${esc(S.bk.dateLabel)}</div>
        </div>
        <div class="confirm-row">
          <div class="confirm-lbl">Время</div>
          <div class="confirm-val">${esc(S.bk.time)}</div>
        </div>
        <div class="confirm-row">
          <div class="confirm-lbl">Напарник</div>
          <div class="confirm-val">${S.bk.partner ? esc(S.bk.partner.name) : S.bk.existingUser ? esc(S.bk.existingUser) : 'Без напарника'}</div>
        </div>
      </div>
    </div>
    <div class="action-bar">
      <button class="action-btn" onclick="submitBooking()">Записаться</button>
    </div>`;
}

async function submitBooking() {
  document.getElementById('book-overlay').querySelector('.overlay-body').innerHTML = html_loading();
  try {
    const r = await api('/book', {
      method: 'POST',
      body: JSON.stringify({
        user_id:    S.userId,
        slot_id:    S.bk.slotId,
        partner_id: S.bk.partner?.user_id || null,
      }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      haptic('error');
      showToast(err.message || 'Ошибка ' + r.status, true);
      S.bookStep = 'confirm';
      renderBookOverlay();
      return;
    }
    const d = await r.json();
    if (d.success) {
      haptic('success');
      S.bookStep = 'success';
      renderBookOverlay();
      loadBookings();
    } else {
      haptic('error');
      showToast(d.message || 'Ошибка при записи', true);
      S.bookStep = 'confirm';
      renderBookOverlay();
    }
  } catch (_) {
    showToast('Ошибка сети. Попробуйте снова.', true);
    S.bookStep = 'confirm';
    renderBookOverlay();
  }
}

/* Step: success */
function renderOverlaySuccess() {
  const bk = S.bk;
  return `
    <div class="success-screen">
      <div class="success-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white"
             stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="success-title">Вы записаны!</div>
      <div class="success-detail-card">
        <div class="success-detail-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          <strong>${esc(bk.serviceName)}</strong>
        </div>
        <div class="success-detail-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <strong>${esc(bk.dateLabel)}</strong>&nbsp;в&nbsp;<strong>${esc(bk.time)}</strong>
        </div>
        ${bk.partner ? `
          <div class="success-detail-row">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
            </svg>
            <strong>${esc(bk.partner.name)}</strong>
          </div>` : ''}
      </div>
      <div style="width:100%">
        <button class="action-btn" onclick="closeOverlay(); switchTab('bookings')">Готово</button>
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════════════
   MODAL (bottom sheet)
══════════════════════════════════════════════════════ */
function modal(inner) {
  document.getElementById('modal-root').innerHTML = `
    <div class="overlay" onclick="closeModal(event)">
      <div class="sheet">${inner}</div>
    </div>`;
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal-root').innerHTML = '';
}

/* ══════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════ */
let _toastT;
function showToast(msg, err = false) {
  clearTimeout(_toastT);
  document.getElementById('toast-root').innerHTML =
    `<div class="toast${err ? ' err' : ''}">${esc(msg)}</div>`;
  _toastT = setTimeout(() => { document.getElementById('toast-root').innerHTML = ''; }, 3200);
}

/* ══════════════════════════════════════════════════════
   SHARED SNIPPETS
══════════════════════════════════════════════════════ */
function html_loading() {
  return `<div class="loading"><div class="spinner"></div></div>`;
}

function html_empty(title, sub) {
  return `
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <div class="empty-title">${esc(title)}</div>
      <div class="empty-sub">${esc(sub)}</div>
    </div>`;
}

/* ══════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════ */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function haptic(type) {
  if (type === 'light')        tg.HapticFeedback.impactOccurred('light');
  else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
  else if (type === 'error')   tg.HapticFeedback.notificationOccurred('error');
}

/* ══════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════ */
init();
</script>
</body>
